<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Placar de Vôlei</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --cor-time-a: #ff4757;
            --cor-time-b: #2e86de;
            --bg-dark: #2f3542;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .placar-container {
            display: flex;
            flex: 1;
            width: 100%;
        }

        .time {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .time-a {
            background-color: var(--cor-time-a);
        }

        .time-b {
            background-color: var(--cor-time-b);
        }

        .nome-time {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .pontos {
            font-size: 20rem;
            font-weight: 800;
            margin: 0;
            line-height: 1;
        }

        .controles-ponto {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-menor {
            background: rgba(0, 0, 0, 0.2);
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.5rem;
        }

        .area-clique {
            position: absolute;
            top: 0;
            width: 100%;
            height: 70%;
            z-index: 1;
        }

        .menu-inferior {
            height: 80px;
            background: #1e2124;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }

        .btn-acao {
            background: #57606f;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .btn-acao:active {
            transform: scale(0.95);
        }

        @media (orientation: landscape) {
            .placar-container {
                flex-direction: row !important;
                /* Garante que fiquem lado a lado */
            }

            .pontos {
                font-size: 15rem;
                /* Aumenta muito o número na horizontal */
            }

            .nome-time {
                font-size: 2rem;
            }

            .menu-inferior {
                height: 60px;
                /* Reduz a barra inferior para sobrar espaço pros pontos */
            }
        }
    </style>
</head>

<body>

    <div class="placar-container" id="container">
        <div class="time time-a" id="bloco-a">
            <div class="area-clique" onclick="alterarPonto('a', 1)"></div>
            <span class="nome-time">Equipe 1</span>
            <p class="pontos" id="pts-a">00</p>
            <div class="controles-ponto" style="z-index: 2;">
                <button class="btn-menor" onclick="alterarPonto('a', -1)"><i class="fas fa-minus"></i></button>
            </div>
        </div>

        <div class="time time-b" id="bloco-b">
            <div class="area-clique" onclick="alterarPonto('b', 1)"></div>
            <span class="nome-time">Equipe 2</span>
            <p class="pontos" id="pts-b">00</p>
            <div class="controles-ponto" style="z-index: 2;">
                <button class="btn-menor" onclick="alterarPonto('b', -1)"><i class="fas fa-minus"></i></button>
            </div>
        </div>
    </div>

    <footer class="menu-inferior">
        <button class="btn-acao" onclick="trocarLados()">
            <i class="fas fa-exchange-alt"></i>
            Trocar Lado
        </button>
        <button class="btn-acao" onclick="resetar()" style="background: #eb4d4b;">
            <i class="fas fa-redo"></i>
            Zerar Set
        </button>
        <button class="btn-acao" onclick="toggleFullScreen()">
            <i class="fas fa-expand"></i>
            Tela Cheia
        </button>
    </footer>

    <script>
        document.addEventListener('click', function () {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Erro ao tentar tela cheia: " + err.message);
                });
            }
        }, { once: true });

        let pontosA = 0;
        let pontosB = 0;
        function salvarDados() {
            const dados = {
                ptsA: pontosA,
                ptsB: pontosB,
                // Salva também se a ordem está invertida para não bugar ao recarregar
                invertido: document.getElementById('container').style.flexDirection === 'row-reverse'
            };
            localStorage.setItem('placarVolei', JSON.stringify(dados));
        }


        function carregarDados() {
            const dadosSalvos = localStorage.getItem('placarVolei');
            if (dadosSalvos) {
                const dados = JSON.parse(dadosSalvos);
                pontosA = dados.ptsA;
                pontosB = dados.ptsB;

                if (dados.invertido) {
                    document.getElementById('container').style.flexDirection = 'row-reverse';
                }

                atualizarTela();
            }
        }

        function atualizarTela() {
            document.getElementById('pts-a').innerText = pontosA.toString().padStart(2, '0');
            document.getElementById('pts-b').innerText = pontosB.toString().padStart(2, '0');
        }

        function alterarPonto(time, valor) {
            if (time === 'a') {
                pontosA = Math.max(0, pontosA + valor);
            } else {
                pontosB = Math.max(0, pontosB + valor);
            }
            salvarDados();
            atualizarTela();
        }

        function trocarLados() {
            const container = document.getElementById('container');
            const blocoA = document.getElementById('bloco-a');
            const blocoB = document.getElementById('bloco-b');

            // Troca a ordem visual dos elementos
            if (container.style.flexDirection === 'row-reverse') {
                container.style.flexDirection = 'row';
            } else {
                container.style.flexDirection = 'row-reverse';
            }
            salvarDados();
        }

        function resetar() {
            if (confirm("Deseja zerar o placar deste set?")) {
                pontosA = 0;
                pontosB = 0;
                salvarDados();
                atualizarTela();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    // Tenta travar a tela em horizontal (funciona em muitos Androids)
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape');
                    }
                });
            } else {
                document.exitFullscreen();
            }
        }
        carregarDados();
    </script>
</body>

</html>
