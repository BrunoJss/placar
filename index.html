<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Placar de Vôlei</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e2124">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icone.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --cor-time-a: #ff4757;
            --cor-time-b: #2e86de;
            --bg-dark: #2f3542;
            --bg-menu: #1e2124;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .d-none {
            display: none;
        }

        /* --- TELA DE MENU --- */
        #menu-inicial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-menu);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .logo-menu {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .btn-menu {
            width: 80%;
            max-width: 300px;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .btn-novo {
            background-color: #2ecc71;
        }

        .btn-continuar {
            background-color: #f1c40f;
            color: #2f3542;
            display: none;
        }

        .btn-menu:active {
            transform: scale(0.95);
        }

        /* --- PLACAR --- */
        .placar-container {
            display: flex;
            flex-grow: 1;
            width: 100%;
        }

        .time {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .time-a {
            background-color: var(--cor-time-a);
        }

        .time-b {
            background-color: var(--cor-time-b);
        }

        .nome-time {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .pontos {
            font-size: 12rem;
            /* Ajustado para caber melhor em várias telas */
            font-weight: 800;
            margin: 0;
            line-height: 1;
        }

        .controles-ponto {
            position: relative;
            z-index: 20;
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-menor {
            background: rgba(0, 0, 0, 0.2);
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.5rem;
        }

        .area-clique {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%;
            z-index: 10;
            /* Aumentamos para garantir */
            cursor: pointer;
        }

        .menu-inferior {
            height: 60px;
            background: #1e2124;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
        }

        .btn-acao {
            background: #57606f;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .time {
            position: relative;
            overflow: hidden;
            /* Garante que o número de fundo não "vaze" do bloco */
        }

        .time::after {
            counter-reset: ponto var(--ponto);
            content: counter(ponto, decimal-leading-zero);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.1);
            /* Use branco com pouca opacidade para brilhar no fundo */
            z-index: 0;
            pointer-events: none;
            /* ISSO GARANTE QUE O CLIQUE PASSE PARA O BOTÃO */
        }

        /* Ajuste individual para cada bloco */
        #bloco-a {
            --ponto: 0;
        }

        #bloco-b {
            --ponto: 0;
        }

        /* Ajuste para o modo horizontal */
        @media (orientation: landscape) {
            .time::after {
                font-size: 20rem;
            }
        }

        @media (orientation: landscape) {
            .pontos {
                font-size: 12rem;
            }

            /* .menu-inferior {
                height: 60px;
            } */
        }
    </style>
</head>

<body>

    <div id="menu-inicial">
        <div class="logo-menu">🏐</div>
        <h2 style="margin-top: 0;">Placar de Vôlei</h2>
        <button class="btn-menu btn-novo" onclick="iniciarPartida(true)">
            <i class="fas fa-play"></i> Nova Partida
        </button>
        <button id="btn-continuar" class="btn-menu btn-continuar" onclick="iniciarPartida(false)">
            <i class="fas fa-history"></i> Continuar Jogo
        </button>
    </div>

    <div class="placar-container" id="container">
        <div class="time time-a" id="bloco-a">
            <div class="area-clique" onclick="alterarPonto('a', 1)"></div>
            <span class="nome-time">Equipe 1</span>
            <p class="pontos" id="pts-a">00</p>
            <div class="controles-ponto" style="z-index: 2;">
                <button class="btn-menor" onclick="alterarPonto('a', -1)"><i class="fas fa-minus"></i></button>
            </div>
        </div>

        <div class="time time-b" id="bloco-b">
            <div class="area-clique" onclick="alterarPonto('b', 1)"></div>
            <span class="nome-time">Equipe 2</span>
            <p class="pontos" id="pts-b">00</p>
            <div class="controles-ponto" style="z-index: 2;">
                <button class="btn-menor" onclick="alterarPonto('b', -1)"><i class="fas fa-minus"></i></button>
            </div>
        </div>
    </div>

    <footer id="footer" class="menu-inferior d-none">
        <button class="btn-acao" onclick="trocarLados()">
            <i class="fas fa-exchange-alt"></i> Trocar Lado
        </button>
        <button class="btn-acao" onclick="resetar()" style="background: #eb4d4b;">
            <i class="fas fa-redo"></i> Zerar Set
        </button>
        <button class="btn-acao" onclick="sairJogo()">
            <i class="fas fa-sign-out-alt"></i> Menu
        </button>
    </footer>


    <script>
        let pontosA = 0;
        let pontosB = 0;

        // Verifica se existem dados ao abrir a página
        window.onload = () => {
            const dadosSalvos = localStorage.getItem('placarVolei');
            if (dadosSalvos) {
                const dados = JSON.parse(dadosSalvos);
                // Só mostra o botão continuar se houver pontos marcados
                if (dados.ptsA > 0 || dados.ptsB > 0) {
                    document.getElementById('btn-continuar').style.display = 'flex';
                }
            }
        };

        function iniciarPartida(isNova) {
            if (isNova) {
                pontosA = 0;
                pontosB = 0;
                salvarDados();
            } else {
                carregarDados();
            }

            document.getElementById('menu-inicial').style.display = 'none';
            document.getElementById('footer').style.display = 'flex';
            atualizarTela();
            entrarFullscreen();
        }

        function entrarFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(e => console.log("Lock não suportado"));
                    }
                }).catch(err => console.log(err));
            }
        }

        function sairJogo() {
            if (confirm("Voltar ao menu? O progresso será mantido.")) {
                if (document.fullscreenElement) document.exitFullscreen();
                document.getElementById('menu-inicial').style.display = 'flex';
                // Recarrega visibilidade do botão continuar
                const dadosSalvos = localStorage.getItem('placarVolei');
                if (dadosSalvos) document.getElementById('btn-continuar').style.display = 'flex';
            }
        }

        function salvarDados() {
            const dados = {
                ptsA: pontosA,
                ptsB: pontosB,
                invertido: document.getElementById('container').style.flexDirection === 'row-reverse'
            };
            localStorage.setItem('placarVolei', JSON.stringify(dados));
        }

        function carregarDados() {
            const dadosSalvos = localStorage.getItem('placarVolei');
            if (dadosSalvos) {
                const dados = JSON.parse(dadosSalvos);
                pontosA = dados.ptsA;
                pontosB = dados.ptsB;
                document.getElementById('container').style.flexDirection = dados.invertido ? 'row-reverse' : 'row';
            }
        }

        function atualizarTela() {
            // 1. Atualiza os números principais
            const txtA = pontosA.toString().padStart(2, '0');
            const txtB = pontosB.toString().padStart(2, '0');

            document.getElementById('pts-a').innerText = txtA;
            document.getElementById('pts-b').innerText = txtB;

            // 2. Atualiza as variáveis CSS para o Ghost Text
            // Importante: passamos o valor puro como número
            document.getElementById('bloco-a').style.setProperty('--ponto', pontosA);
            document.getElementById('bloco-b').style.setProperty('--ponto', pontosB);

            console.log(`Placar atualizado: A:${pontosA} B:${pontosB}`); // Debug rápido
        }

        function alterarPonto(time, valor) {
            if (time === 'a') pontosA = Math.max(0, pontosA + valor);
            else pontosB = Math.max(0, pontosB + valor);

            if (navigator.vibrate) navigator.vibrate(50);
            salvarDados();
            atualizarTela();
        }

        function trocarLados() {
            const container = document.getElementById('container');
            container.style.flexDirection = (container.style.flexDirection === 'row-reverse') ? 'row' : 'row-reverse';
            salvarDados();
        }

        function forcarLandscape() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(e => console.log("Lock negado"));
                    }
                });
            } else {
                // Se já estiver em fullscreen, apenas reforça o lock
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(e => console.log("Lock negado"));
                }
            }
        }

        function resetar() {
            if (confirm("Zerar o placar deste set?")) {
                pontosA = 0;
                pontosB = 0;
                salvarDados();
                atualizarTela();
                // Se quiser "resetar" a tela cheia e forçar o landscape de novo:
                if (document.fullscreenElement) {
                    document.exitFullscreen().then(() => {
                        // O navegador terminou de sair, agora pedimos para entrar de novo
                        // Note que o .then() garante que a ordem seja respeitada
                        setTimeout(() => {
                            forcarLandscape();
                        }, 150); // Um delay mínimo de 100ms só para o SO respirar
                    });
                } else {
                    forcarLandscape();
                }
            }
        }
    </script>
</body>

</html>
